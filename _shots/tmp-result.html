<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>当下心境自查</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230e7d6e'/%3E%3Cpath d='M8 23c3-9 9-13 15-13-1 6-6 13-15 13z' fill='%23ffffff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#eef5f2;
  --surface:#ffffff;
  --ink:#22403b;
  --muted:#667f79;
  --line:#d7e5e0;
  --primary:#0e7d6e;
  --primary-deep:#0a5c52;
  --primary-soft:#dff0ea;
  --green:#2f9e6e;
  --green-soft:#e2f2ea;
  --amber:#c98a1b;
  --amber-soft:#f6ecd7;
  --orange:#d9552f;
  --orange-soft:#fbe7e0;
  --radius:18px;
  --shadow:0 8px 24px rgba(31,78,68,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:auto}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid rgba(14,125,110,.45);outline-offset:2px;border-radius:8px}

.app{min-height:100vh;display:flex;flex-direction:column}
.view{display:none;flex:1}
.view.active{display:block}
.wrap{max-width:640px;margin:0 auto;padding:36px 20px 56px}

/* ===== 通用按钮 ===== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:1px solid transparent;border-radius:14px;
  padding:13px 22px;font-size:15px;font-weight:500;
  transition:background .18s,transform .12s,box-shadow .18s;
}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--primary);color:#fff;box-shadow:0 6px 16px rgba(14,125,110,.25)}
.btn.primary:hover:not(:disabled){background:var(--primary-deep)}
.btn.primary:disabled{background:#9fc2b9;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--primary-deep)}
.btn.ghost:hover{background:var(--primary-soft)}
.icon-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:44px;height:44px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface);color:var(--primary-deep);
}
.icon-btn:hover{background:var(--primary-soft)}
.hidden{display:none !important}

/* ===== 首页 ===== */
.home{text-align:center}
.hero{margin:26px 0 30px}
.hero .motif{width:72px;height:72px;margin:0 auto 18px;color:var(--primary)}
.hero h1{
  font-family:'Noto Serif SC','Songti SC',serif;
  font-size:34px;font-weight:700;letter-spacing:.02em;
}
.hero .lead{color:var(--muted);font-size:15px;margin-top:14px;max-width:460px;margin-left:auto;margin-right:auto}
.tier-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:0 0 20px}
.tier{
  background:var(--surface);border:2px solid var(--line);border-radius:var(--radius);
  padding:18px 12px 14px;text-align:center;color:var(--ink);
  transition:border-color .18s,background .18s,box-shadow .18s;
}
.tier:hover{border-color:#9dc9bf;box-shadow:var(--shadow)}
.tier.sel{border-color:var(--primary);background:var(--primary-soft)}
.tier .t-num{display:block;font-family:'Noto Serif SC','Songti SC',serif;font-size:30px;font-weight:700;color:var(--primary-deep);line-height:1.2}
.tier.sel .t-num{color:var(--primary)}
.tier .t-unit{font-size:14px;color:var(--muted)}
.tier .t-meta{display:block;font-size:13px;color:var(--muted);margin-top:6px}
/* ===== 录音卡片 ===== */
.advice-card{
  background:var(--primary-deep);color:#fff;border-radius:18px;
  padding:13px 16px;margin:-6px 0 22px;
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  box-shadow:0 10px 24px rgba(10,92,82,.22);
}
.advice-txt{text-align:left;min-width:0}
.advice-title{font-size:15.5px;font-weight:700;font-family:'Noto Serif SC','Songti SC',serif}
.advice-sub{font-size:13px;color:#cfe9e2;margin-top:2px}
.play-btn{
  flex:none;width:52px;height:52px;border-radius:50%;background:#fff;color:var(--primary-deep);
  display:flex;align-items:center;justify-content:center;border:none;
  box-shadow:0 4px 12px rgba(0,0,0,.18);transition:transform .15s;
}
.play-btn:hover{transform:scale(1.06)}
.play-btn .ic-pause{display:none}
.play-btn.playing .ic-play{display:none}
.play-btn.playing .ic-pause{display:block}
.play-btn.small{width:44px;height:44px;box-shadow:none;background:var(--primary-soft);color:var(--primary-deep)}
.raudio{
  display:flex;align-items:center;gap:12px;
  background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:10px 16px;margin-bottom:18px;font-size:14px;color:#3c5751;
}
.raudio .r-state{color:var(--muted);font-size:13px;margin-left:auto}

.btn-start{width:100%;margin-top:6px}
#btn-resume{margin-top:12px}
.note{
  margin-top:26px;font-size:13px;color:#8aa09b;line-height:1.8;
  border-top:1px dashed var(--line);padding-top:16px;
}

/* ===== 答题页 ===== */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.topbar .count{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.progress{height:8px;background:#dce9e4;border-radius:99px;overflow:hidden;margin-bottom:22px}
.progress .fill{height:100%;width:0;background:var(--primary);border-radius:99px;transition:width .25s ease}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px 24px 22px;box-shadow:var(--shadow)}
.chip{
  display:inline-block;background:var(--primary-soft);color:var(--primary-deep);
  font-size:13px;font-weight:500;padding:4px 12px;border-radius:99px;
}
.qcard h2{
  font-family:'Noto Serif SC','Songti SC',serif;
  font-size:21px;font-weight:600;line-height:1.65;margin:14px 0 20px;
  min-height:2.2em;
}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  display:flex;align-items:center;gap:14px;text-align:left;
  background:#f7fbf9;border:1.5px solid var(--line);border-radius:14px;
  padding:13px 16px;font-size:15px;color:var(--ink);
  transition:border-color .15s,background .15s;
}
.opt:hover{border-color:#9dc9bf}
.opt.sel{border-color:var(--primary);background:var(--primary-soft)}
.opt .opt-num{
  flex:none;width:30px;height:30px;border-radius:50%;
  background:var(--surface);border:1.5px solid #c6dcd5;color:var(--primary-deep);
  display:flex;align-items:center;justify-content:center;
  font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;
}
.opt.sel .opt-num{background:var(--primary);border-color:var(--primary);color:#fff}
.opt .opt-label{flex:1}
.navrow{display:flex;gap:12px;margin-top:20px}
.navrow .btn{flex:1}

/* ===== 结果页 ===== */
.rhead{
  text-align:center;background:var(--surface);border:1px solid var(--line);
  border-radius:22px;padding:28px 22px 24px;box-shadow:var(--shadow);margin-bottom:18px;
}
.rhead .badge{
  width:118px;height:118px;border-radius:50%;margin:0 auto 14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:6px solid;color:var(--ink);
}
.rhead .badge .pct{font-family:'Noto Serif SC','Songti SC',serif;font-size:34px;font-weight:700;line-height:1.1}
.rhead .badge .pct small{font-size:14px;font-weight:500}
.rhead .tier-label{display:inline-block;font-size:15px;font-weight:700;padding:4px 16px;border-radius:99px;margin-top:2px}
.rhead .concl{font-size:14.5px;color:#3c5751;margin-top:12px;max-width:520px;margin-left:auto;margin-right:auto}
.badge.good{border-color:var(--green);background:var(--green-soft)}
.badge.good .tier-label{background:var(--green);color:#fff}
.badge.mid{border-color:var(--amber);background:var(--amber-soft)}
.badge.mid .tier-label{background:var(--amber);color:#fff}
.badge.low{border-color:var(--orange);background:var(--orange-soft)}
.badge.low .tier-label{background:var(--orange);color:#fff}

.rgrid{display:grid;grid-template-columns:1.05fr 1fr;gap:16px;margin-bottom:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px}
.panel h3{font-size:16px;font-weight:700;margin-bottom:14px;font-family:'Noto Serif SC','Songti SC',serif}
#radar{width:100%;height:330px}
.radar-note{font-size:13px;color:#8aa09b;margin-top:6px;text-align:center}
.dim-item{padding:13px 0;border-bottom:1px dashed var(--line)}
.dim-item:last-child{border-bottom:none;padding-bottom:2px}
.dim-item .d-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.dim-item .d-name{font-size:14.5px;font-weight:700}
.dim-item .d-pct{font-size:14px;font-variant-numeric:tabular-nums;color:var(--muted)}
.dim-item .d-bar{height:8px;border-radius:99px;background:#e7efec;overflow:hidden;margin-bottom:8px}
.dim-item .d-bar .fill{height:100%;border-radius:99px;transition:width .3s}
.dim-item .d-tip{font-size:14px;color:#52706a;line-height:1.65}
.fill.good{background:var(--green)}
.fill.mid{background:var(--amber)}
.fill.low{background:var(--orange)}
.advice{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px 22px;margin-bottom:18px}
.advice h3{font-size:16px;font-weight:700;margin-bottom:12px;font-family:'Noto Serif SC','Songti SC',serif}
.advice p{font-size:14.5px;color:#3c5751;margin-bottom:12px}
.advice ul{list-style:none;display:flex;flex-direction:column;gap:9px}
.advice li{display:flex;gap:10px;font-size:14px;color:#3c5751;align-items:flex-start}
.advice li .idx{
  flex:none;width:22px;height:22px;border-radius:50%;background:var(--primary-soft);color:var(--primary-deep);
  font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px;
}
.actions{display:flex;gap:12px}
.actions .btn{flex:1}

/* ===== Toast ===== */
.toast{
  position:fixed;left:50%;bottom:34px;transform:translateX(-50%);
  background:#223b36;color:#fff;font-size:14px;padding:11px 22px;border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:99;opacity:1;transition:opacity .25s;
}
.toast.fade{opacity:0}

/* ===== 响应式 ===== */
@media (max-width:600px){
  .wrap{padding:24px 16px 48px}
  .hero h1{font-size:28px}
  .hero .motif{width:60px;height:60px}
  .qcard{padding:20px 16px 18px}
  .qcard h2{font-size:18px}
  .rgrid{grid-template-columns:1fr}
  #radar{height:300px}
  .actions{flex-direction:column}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important}
}
</style>
</head>
<body>
<div class="app">

  <!-- ===== 视图：首页 ===== -->
  <section id="view-home" class="view">
    <div class="wrap home">
      <div class="hero">
        <svg class="motif" viewBox="0 0 72 72" fill="none" aria-hidden="true">
          <circle cx="36" cy="36" r="30" stroke="currentColor" stroke-width="1.6" opacity=".28"/>
          <circle cx="36" cy="36" r="21" stroke="currentColor" stroke-width="1.6" opacity=".5"/>
          <circle cx="36" cy="36" r="12" stroke="currentColor" stroke-width="2"/>
          <circle cx="36" cy="36" r="4" fill="currentColor"/>
        </svg>
        <h1>当下心境自查</h1>
        <p class="lead">用一组简单的问题，看看自己最近的心境状态。题目没有对错，按第一反应选择就好。答题数量可以由你决定：10 题快速感受，80 题全面排查。</p>
      </div>
      <div class="advice-card">
        <div class="advice-txt">
          <div class="advice-title">来自小雨的忠告</div>
          <div class="advice-sub" id="advice-state">点一下，先听她说</div>
        </div>
        <button class="play-btn" id="btn-advice" aria-label="播放小雨的忠告">
          <svg class="ic-play" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg class="ic-pause" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
        <audio id="audio-advice" src="assets/record95.mp3" preload="auto"></audio>
      </div>
      <div class="tier-grid" id="tier-grid">
        <button class="tier" data-tier="10"><span class="t-num">10<span class="t-unit"> 题</span></span><span class="t-meta">约 2 分钟 · 快速感受</span></button>
        <button class="tier sel" data-tier="20"><span class="t-num">20<span class="t-unit"> 题</span></span><span class="t-meta">约 4 分钟 · 日常自测</span></button>
        <button class="tier" data-tier="50"><span class="t-num">50<span class="t-unit"> 题</span></span><span class="t-meta">约 10 分钟 · 深入了解</span></button>
        <button class="tier" data-tier="80"><span class="t-num">80<span class="t-unit"> 题</span></span><span class="t-meta">约 16 分钟 · 全面排查</span></button>
      </div>
      <button id="btn-start" class="btn primary btn-start">开始答题</button>
      <button id="btn-resume" class="btn ghost hidden">继续上次未完成的答题</button>
      <p class="note">本测评仅用于自我了解与参考，不构成医学或心理诊断。若情绪困扰持续两周以上，建议前往正规医院心理科或专业心理咨询机构寻求帮助。</p>
    </div>
  </section>

  <!-- ===== 视图：答题 ===== -->
  <section id="view-quiz" class="view">
    <div class="wrap quiz">
      <div class="topbar">
        <button id="btn-home" class="icon-btn" aria-label="返回首页">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <span class="count" id="q-count">1 / 10</span>
      </div>
      <div class="progress"><div class="fill" id="q-progress-fill"></div></div>
      <div class="qcard">
        <span class="chip" id="q-dim">情绪状态</span>
        <h2 id="q-text"></h2>
        <div class="opts" id="q-opts"></div>
      </div>
      <div class="navrow">
        <button id="q-prev" class="btn ghost">上一题</button>
        <button id="q-next" class="btn primary">下一题</button>
      </div>
    </div>
  </section>

  <!-- ===== 视图：结果 ===== -->
  <section id="view-result" class="view">
    <div class="wrap result">
      <div class="topbar">
        <button id="btn-home2" class="icon-btn" aria-label="返回首页">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <span class="count" id="r-count"></span>
      </div>
      <div class="rhead" id="rhead"></div>
      <div class="raudio" id="raudio">
        <button class="play-btn small" id="btn-result-audio" aria-label="播放小雨的话">
          <svg class="ic-play" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg class="ic-pause" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
        <span>小雨留给你的话</span>
        <span class="r-state" id="result-audio-state">自动播放中…</span>
        <audio id="audio-result" src="assets/record94.mp3" preload="auto"></audio>
      </div>
      <div class="rgrid">
        <div class="panel">
          <h3>六维状态图</h3>
          <div id="radar"></div>
          <div class="radar-note">数值越高代表该维度状态越好</div>
        </div>
        <div class="panel">
          <h3>各维度解读</h3>
          <div id="dim-list"></div>
        </div>
      </div>
      <div class="advice" id="advice"></div>
      <div class="actions">
        <button id="btn-retry" class="btn primary">再测一次（同档位）</button>
        <button id="btn-change" class="btn ghost">换档位再测</button>
      </div>
      <p class="note">本测评仅用于自我了解与参考，不构成医学或心理诊断。若情绪困扰持续两周以上，建议前往正规医院心理科或专业心理咨询机构寻求帮助。</p>
    </div>
  </section>

</div>
<div id="toast" class="toast hidden"></div>

// ===== 状态与工具 =====
var STORE_KEY = 'moodCheck.v1';
var state = null;          // {tier, qs:[], answers:{}, idx, finished}
var selectedTier = 20;

function $(id){ return document.getElementById(id); }
function shuffle(arr){
  for(var i=arr.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=arr[i];arr[i]=arr[j];arr[j]=t;
  }
  return arr;
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify({
    tier:state.tier, qs:state.qs.map(function(q){return q.id;}),
    answers:state.answers, idx:state.idx, finished:state.finished
  })); }catch(e){}
}
function loadSaved(){
  try{
    var raw=localStorage.getItem(STORE_KEY);
    if(!raw) return null;
    var d=JSON.parse(raw);
    if(!d || !d.tier || !d.qs || !d.qs.length) return null;
    var byId={}; BANK.forEach(function(q){byId[q.id]=q;});
    var qs=d.qs.map(function(id){return byId[id];}).filter(Boolean);
    if(!qs.length) return null;
    return {tier:d.tier, qs:qs, answers:d.answers||{}, idx:d.idx||0, finished:!!d.finished};
  }catch(e){ return null; }
}
function clearSaved(){ try{ localStorage.removeItem(STORE_KEY); }catch(e){} }

// ===== 档位抽题：按维度均匀抽取后交错排序 =====
function pickQuestions(tier){
  var quota=TIER_QUOTA[tier];
  var groups={};
  DIMS.forEach(function(d){ groups[d]=BANK.filter(function(q){return q.dim===d;}); });
  DIMS.forEach(function(d){ shuffle(groups[d]); });
  var picked=[];
  DIMS.forEach(function(d){
    for(var i=0;i<quota[d] && i<groups[d].length;i++) picked.push(groups[d][i]);
  });
  // 交错排序：轮换维度，避免同维度题目连续出现
  var g2={}; picked.forEach(function(q){ (g2[q.dim]=g2[q.dim]||[]).push(q); });
  var keys=DIMS.filter(function(d){return g2[d] && g2[d].length;});
  var out=[], gi=0;
  while(out.length<picked.length){
    var k=keys[gi%keys.length];
    if(g2[k] && g2[k].length) out.push(g2[k].shift());
    gi++;
  }
  return out;
}

// ===== 视图路由 =====
function currentView(){ return (location.hash||'#/home').replace('#/','') || 'home'; }
function nav(name){
  if(location.hash !== '#/'+name) location.hash = '#/'+name;
  else renderView(name);
}
function renderView(name){
  var map={home:$('view-home'),quiz:$('view-quiz'),result:$('view-result')};
  Object.keys(map).forEach(function(k){ map[k].classList.toggle('active', k===name); });
  if(name==='home') renderHome();
  if(name==='quiz') renderQuiz();
  if(name==='result') renderResult();
}
window.addEventListener('hashchange', function(){ renderView(currentView()); });

// ===== Toast =====
var toastTimer=null;
function toast(msg){
  var t=$('toast');
  t.textContent=msg; t.classList.remove('hidden','fade');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ t.classList.add('fade'); }, 1800);
}

// ===== 首页 =====
function renderHome(){
  document.querySelectorAll('#tier-grid .tier').forEach(function(b){
    b.classList.toggle('sel', Number(b.getAttribute('data-tier'))===selectedTier);
  });
  $('btn-start').disabled = !selectedTier;
  var saved=loadSaved();
  $('btn-resume').classList.toggle('hidden', !(saved && !saved.finished));
}
function startQuiz(tier, resumeState){
  var s = resumeState || {tier:tier, qs:pickQuestions(tier), answers:{}, idx:0, finished:false};
  state=s; save(); nav('quiz');
}

// ===== 答题页 =====
function renderQuiz(){
  if(!state){ nav('home'); return; }
  var q=state.qs[state.idx];
  $('q-count').textContent=(state.idx+1)+' / '+state.qs.length;
  $('q-progress-fill').style.width=((state.idx+1)/state.qs.length*100)+'%';
  $('q-dim').textContent=DIM_NAMES[q.dim];
  $('q-text').textContent=q.text;
  var box=$('q-opts'); box.innerHTML='';
  OPTS.forEach(function(label,i){
    var b=document.createElement('button');
    b.type='button';
    b.className='opt'+(state.answers[q.id]===i+1?' sel':'');
    b.setAttribute('aria-pressed', state.answers[q.id]===i+1?'true':'false');
    b.innerHTML='<span class="opt-num">'+(i+1)+'</span><span class="opt-label">'+label+'</span>';
    b.addEventListener('click', function(){
      state.answers[q.id]=i+1; save(); renderQuiz();
    });
    box.appendChild(b);
  });
  $('q-prev').disabled = state.idx===0;
  $('q-next').textContent = state.idx===state.qs.length-1 ? '查看结果' : '下一题';
}

// ===== 结果计算 =====
function tierOf(pct){ return pct>=75?'high':(pct>=50?'mid':'low'); }
function compute(){
  var dimScores={};
  DIMS.forEach(function(d){ dimScores[d]=null; });
  state.qs.forEach(function(q){
    var v=state.answers[q.id];
    if(!v) return;
    var val=q.rev ? 6-v : v;
    if(dimScores[q.dim]===null) dimScores[q.dim]=[];
    dimScores[q.dim].push(val);
  });
  var means={}, sum=0, n=0;
  DIMS.forEach(function(d){
    if(dimScores[d] && dimScores[d].length){
      var m=dimScores[d].reduce(function(a,b){return a+b;},0)/dimScores[d].length;
      means[d]={mean:m, pct:Math.round(m/5*100), n:dimScores[d].length};
      sum+=m; n++;
    } else means[d]=null;
  });
  var overall = n ? sum/n : 0;
  return {means:means, overallPct:Math.round(overall/5*100)};
}

// ===== 结果页 =====
var radarChart=null;
var onResize=function(){ if(radarChart) radarChart.resize(); };
function renderResult(){
  if(!state || !state.finished){ nav('home'); return; }
  var r=compute();
  $('r-count').textContent='共 '+state.qs.length+' 题 · 六维状态';
  var tier=tierOf(r.overallPct);
  var ov=INTERP.overall[tier];
  var head=$('rhead');
  head.innerHTML=
    '<div class="badge '+ov.cls+'"><span class="pct">'+r.overallPct+'<small> / 100</small></span><span class="tier-label">'+ov.label+'</span></div>'+
    '<p class="concl">'+ov.text+'</p>';
  // 维度解读
  var list=$('dim-list'); list.innerHTML='';
  DIMS.forEach(function(d){
    var m=r.means[d];
    if(!m){ return; }
    var dt=tierOf(m.pct);
    var tip=INTERP.dims[d][dt];
    var item=document.createElement('div');
    item.className='dim-item';
    item.innerHTML='<div class="d-top"><span class="d-name">'+DIM_NAMES[d]+'</span><span class="d-pct">'+m.pct+' / 100</span></div>'+
      '<div class="d-bar"><div class="fill '+dt+'" style="width:'+m.pct+'%"></div></div>'+
      '<div class="d-tip">'+tip+'</div>';
    list.appendChild(item);
  });
  // 建议
  var adv=$('advice');
  var points=ov.points.map(function(p,i){
    return '<li><span class="idx">'+(i+1)+'</span><span>'+p+'</span></li>';
  }).join('');
  adv.innerHTML='<h3>给你的建议</h3><p>'+ov.text+'</p><ul>'+points+'</ul>';
  drawRadar(r);
}
function drawRadar(r){
  var el=$('radar');
  if(!window.echarts){
    el.innerHTML='<div class="radar-note">图表组件未能加载，各维度数值请参考右侧解读。</div>';
    return;
  }
  if(radarChart){ radarChart.dispose(); radarChart=null; }
  radarChart=echarts.init(el);
  radarChart.setOption({
    radar:{
      indicator:DIMS.map(function(d){
        return {name:DIM_NAMES[d], max:100};
      }),
      radius:'62%', splitNumber:4,
      axisName:{color:'#22403b', fontSize:13},
      axisLine:{lineStyle:{color:'#cfe0da'}},
      splitLine:{lineStyle:{color:'#d7e5e0'}},
      splitArea:{areaStyle:{color:['#f7fbf9','#eef5f2']}}
    },
    tooltip:{trigger:'item'},
    series:[{
      type:'radar',
      symbol:'none',
      lineStyle:{color:'#0e7d6e', width:2},
      areaStyle:{color:'rgba(14,125,110,.25)'},
      data:[{value:DIMS.map(function(d){return r.means[d]?r.means[d].pct:0;}), name:'当前状态'}]
    }]
  });
  window.removeEventListener('resize', onResize);
  window.addEventListener('resize', onResize);
}

// ===== 事件绑定 =====
(function(){
  var tierBox=$('tier-grid');
  tierBox.addEventListener('click', function(e){
    var b=e.target.closest('.tier');
    if(!b) return;
    selectedTier=Number(b.getAttribute('data-tier'));
    renderHome();
  });
  $('btn-start').addEventListener('click', function(){ startQuiz(selectedTier, null); });
  $('btn-resume').addEventListener('click', function(){
    var s=loadSaved();
    if(s && !s.finished) startQuiz(s.tier, s);
    else toast('没有找到未完成的记录');
  });
  $('btn-home').addEventListener('click', function(){ nav('home'); });
  $('btn-home2').addEventListener('click', function(){ nav('home'); });
  $('q-prev').addEventListener('click', function(){
    if(state.idx>0){ state.idx--; save(); renderQuiz(); }
  });
  $('q-next').addEventListener('click', function(){
    var q=state.qs[state.idx];
    if(!state.answers[q.id]){ toast('请先选择一项再继续'); return; }
    if(state.idx===state.qs.length-1){
      state.finished=true; save(); nav('result');
      var ar=$('audio-result');
      if(ar){
        ar.currentTime=0;
        var p=ar.play();
        if(p && p.catch) p.catch(function(){});
      }
    } else {
      state.idx++; save(); renderQuiz();
    }
  });
  $('btn-retry').addEventListener('click', function(){
    startQuiz(state.tier, null);
  });
  $('btn-change').addEventListener('click', function(){ nav('home'); });

  // ===== 录音播放 =====
  var av=$('audio-advice'), avBtn=$('btn-advice'), avState=$('advice-state');
  avBtn.addEventListener('click', function(){
    if(av.paused){ av.play(); } else { av.pause(); }
  });
  av.addEventListener('play', function(){ avBtn.classList.add('playing'); avState.textContent='播放中…'; });
  av.addEventListener('pause', function(){ avBtn.classList.remove('playing'); avState.textContent=av.ended?'听完了，开始吧':'点一下，先听她说'; });
  av.addEventListener('ended', function(){ avBtn.classList.remove('playing'); avState.textContent='听完了，开始吧'; });

  var ar=$('audio-result'), arBtn=$('btn-result-audio'), arState=$('result-audio-state');
  arBtn.addEventListener('click', function(){
    if(ar.paused){ ar.play(); } else { ar.pause(); }
  });
  ar.addEventListener('play', function(){ arBtn.classList.add('playing'); arState.textContent='播放中…'; });
  ar.addEventListener('pause', function(){ arBtn.classList.remove('playing'); arState.textContent=ar.ended?'已播放完毕':'已暂停'; });
  ar.addEventListener('ended', function(){ arBtn.classList.remove('playing'); arState.textContent='已播放完毕'; });

  renderHome();
  renderView(currentView());
})();
</script>

  state=s;
  localStorage.setItem('moodCheck.v1', JSON.stringify({tier:s.tier, qs:s.qs.map(function(q){return q.id;}), answers:s.answers, idx:0, finished:true}));
  location.hash='#/result';
  setTimeout(function(){
    var a=document.getElementById('audio-result');
    if(a){ var p=a.play(); if(p&&p.catch) p.catch(function(){}); }
  }, 400);
})();
</script>
</body>
</html>
